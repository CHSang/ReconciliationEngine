spring:
  application:
    name: reconciliation-engine
  main:
    banner-mode: off
  # Run history for resuming failed runs. Delete ./work to clear it.
  datasource:
    url: jdbc:h2:file:./work/batch-db;TRACE_LEVEL_FILE=0   # no trace file for the "table exists" notes on each start
    username: sa
    password: ""
  batch:
    jdbc:
      initialize-schema: always   # create Spring Batch's tables on first start
    job:
      enabled: false              # ReconciliationJobRunner starts the job, not Spring Boot

reconciliation:
  input:
    dbs: ./input/dbs-records.csv
    quantifeed: ./input/quantifeed-records.csv
  output:
    file: ./output/reconciliation-results.csv

  # A trade found in only one system is PENDING until businessDate + settlement-days, then a BREAK.
  settlement-days: 2
  # run-date: 2026-10-28    # date the reconciliation runs for; today when not set

  # A failing step is tried max-attempts times in total, waiting delay between attempts. 1 turns retry off.
  retry:
    max-attempts: 3
    delay: 2s
